[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `alembic/` sits beside `app/`, which defeats setuptools' flat-layout
# auto-discovery. Name the one real package explicitly.
[tool.setuptools]
packages = ["app"]

[project]
name = "nexly-api"
version = "0.1.0"
description = "Nexly backend — language-learning marketplace for Cameroon"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.12",
  "httpx>=0.28",
  "arq>=0.26",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
