# Local dependencies only. Staging and production use Neon for Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexly
      POSTGRES_PASSWORD: nexly
      POSTGRES_DB: nexly
    ports:
      - "5432:5432"
    volumes:
      - nexly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexly -d nexly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs Arq: transcoding, payout runs, booking reminders.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  nexly_pgdata:
